# EXAMPLE workflow for the Anthropic TWIN repo (lamna-portal-anthropic).
# Do NOT place this in this repo's .github/workflows/ — it belongs in the twin
# repo. It wires Claude Code GitHub Actions so that commenting "@claude" on an
# issue or PR opens/updates a pull request.
#
# Prereqs in the twin repo:
#   - Install the Claude GitHub App.
#   - Add repo secret ANTHROPIC_API_KEY (per-developer key — note this on camera).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when someone mentions @claude
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # NOTE: no security scanning / autofix step is built into this flow,
          # and auth is a per-developer API key rather than an enterprise identity.
